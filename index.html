<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🐰 廣島・山陽旅遊 | 日系繪本行程手冊</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-washi: #FFFCF6;
      --ink: #3E3A39;
      --coral: #F2A497;
      --yamabuki: #F6D27A;
      --mizu: #A8D3E6;
      --wakatake: #B9DAA5;
      --white: #FFFFFF;
      --border-w: 3px;
      --shadow-offset: 4px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-washi);
      background-image:
        radial-gradient(#E8E0D0 1.2px, transparent 1.2px),
        radial-gradient(#EFE8D8 1.2px, var(--bg-washi) 1.2px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      color: var(--ink);
      font-family: 'Huninn', -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
      line-height: 1.55;
      padding-top: 68px;
      padding-bottom: 48px;
    }

    .app-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* 頂端固定選單 */
    .top-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background-color: var(--bg-washi);
      border-bottom: var(--border-w) solid var(--ink);
      padding: 8px 12px;
    }

    .top-nav-inner {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .top-nav-inner::-webkit-scrollbar { display: none; }

    .nav-pill {
      flex-shrink: 0;
      text-decoration: none;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      padding: 5px 11px;
      border-radius: 999px;
      border: 2.5px solid var(--ink);
      background: var(--white);
      box-shadow: 0 2px 0 var(--ink);
      transition: transform 0.15s ease;
    }
    .nav-pill:active {
      transform: translateY(2px);
      box-shadow: none;
    }
    .nav-pill.c-mizu { background: var(--mizu); }
    .nav-pill.c-yama { background: var(--yamabuki); }
    .nav-pill.c-coral { background: var(--coral); }
    .nav-pill.c-waka { background: var(--wakatake); }

    /* 繪本風通用卡片與硬陰影 */
    .ehon-card {
      background: var(--white);
      border: var(--border-w) solid var(--ink);
      border-radius: 24px;
      box-shadow: 0 var(--shadow-offset) 0 var(--ink);
      padding: 16px;
      margin-bottom: 18px;
      position: relative;
    }

    .ehon-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 12px;
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      background: var(--yamabuki);
      color: var(--ink);
    }

    /* 首頁主視覺卡片 */
    .hero-card {
      padding: 0;
      overflow: hidden;
      background: var(--mizu);
    }

    .hero-svg-wrap {
      width: 100%;
      background: #CBE7F5;
      border-bottom: var(--border-w) solid var(--ink);
      display: block;
      line-height: 0;
    }

    .hero-info {
      padding: 16px 18px 18px;
      background: var(--mizu);
    }

    .hero-title {
      margin: 0 0 4px;
      font-size: 26px;
      letter-spacing: 0.5px;
    }

    .hero-sub {
      margin: 0;
      font-size: 15px;
      opacity: 0.9;
    }

    .countdown-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      gap: 10px;
    }

    .countdown-pill {
      background: var(--yamabuki);
      border: var(--border-w) solid var(--ink);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 3px 0 var(--ink);
    }

    /* 快捷 5 大圖示列 */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .quick-item {
      text-decoration: none;
      color: var(--ink);
      border: var(--border-w) solid var(--ink);
      border-radius: 18px;
      padding: 10px 4px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      box-shadow: 0 3px 0 var(--ink);
      font-size: 13px;
      font-weight: 700;
      transition: transform 0.15s ease;
    }
    .quick-item:active {
      transform: translateY(3px);
      box-shadow: none;
    }
    .quick-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--white);
      border: 2.5px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 區塊標題 */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 26px 0 12px;
      scroll-margin-top: 76px;
    }

    .section-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title {
      margin: 0;
      font-size: 21px;
    }

    /* 航班卡片 */
    .flight-route {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 12px;
    }

    .airport-code {
      font-size: 28px;
      font-weight: 700;
      line-height: 1.1;
    }

    .airport-name {
      font-size: 13px;
      margin-top: 2px;
    }

    .flight-time {
      font-size: 15px;
      font-weight: 700;
      margin-top: 4px;
    }

    .plane-circle {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--bg-washi);
      border: 2.5px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flight-footer {
      border-top: 2px dashed var(--ink);
      padding-top: 8px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
    }

    /* 日期切換按鈕列 */
    .day-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .day-tabs::-webkit-scrollbar { display: none; }

    .day-tab {
      flex-shrink: 0;
      background: var(--white);
      color: var(--ink);
      border: var(--border-w) solid var(--ink);
      border-radius: 18px;
      padding: 8px 14px;
      font-family: inherit;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 3px 0 var(--ink);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .day-tab.active {
      background: var(--yamabuki);
      animation: tabBounce 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .day-tab-num {
      display: block;
      font-size: 16px;
      font-weight: 700;
    }

    .day-tab-date {
      display: block;
      font-size: 12px;
    }

    @keyframes tabBounce {
      0% { transform: scale(0.92) translateY(2px); }
      55% { transform: scale(1.07) translateY(-3px); }
      100% { transform: scale(1) translateY(0); }
    }

    @keyframes timelinePop {
      0% { opacity: 0; transform: translateY(12px) scale(0.97); }
      65% { opacity: 1; transform: translateY(-3px) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3.5px); }
    }

    @keyframes gentleSway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2.5deg); }
    }

    @keyframes bunnyHop {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .anim-float { animation: gentleFloat 3.6s ease-in-out infinite; }
    .anim-sway { transform-origin: center; animation: gentleSway 4.2s ease-in-out infinite; }
    .anim-hop { animation: bunnyHop 2.4s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after {
      animation: none !important;
      transition: none !important;
    }

    /* 時間軸樣式 */
    .timeline-wrap {
      position: relative;
      padding-left: 26px;
    }

    .timeline-wrap::before {
      content: "";
      position: absolute;
      left: 9px;
      top: 18px;
      bottom: 18px;
      width: 0;
      border-left: 3px dashed var(--ink);
    }

    .timeline-item {
      position: relative;
      margin-bottom: 16px;
      animation: timelinePop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .timeline-dot {
      position: absolute;
      left: -25px;
      top: 18px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid var(--ink);
      background: var(--yamabuki);
      z-index: 2;
    }

    .timeline-item:nth-child(2n) .timeline-dot { background: var(--coral); }
    .timeline-item:nth-child(3n) .timeline-dot { background: var(--mizu); }
    .timeline-item:nth-child(4n) .timeline-dot { background: var(--wakatake); }

    .spot-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .spot-time {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      margin-bottom: 2px;
    }

    .spot-title {
      font-size: 18px;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .must-go-badge {
      flex-shrink: 0;
      background: var(--coral);
      color: var(--ink);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 2px 0 var(--ink);
    }

    .spot-note {
      font-size: 14px;
      margin: 0 0 10px;
      opacity: 0.85;
    }

    .spot-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .transport-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 11px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .t-bus { background: var(--coral); }
    .t-train { background: var(--wakatake); }
    .t-walk { background: var(--mizu); }
    .t-ship { background: var(--yamabuki); }

    .nav-map-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 12px;
      background: var(--yamabuki);
      color: var(--ink);
      text-decoration: none;
      border: 2px solid var(--ink);
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 2px 0 var(--ink);
    }

    .card-actions {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .action-btn {
      background: var(--bg-washi);
      border: 2px solid var(--ink);
      border-radius: 10px;
      padding: 3px 8px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .action-btn.del { background: #FFD8D8; }

    .tip-banner {
      background: var(--wakatake);
      border: var(--border-w) solid var(--ink);
      border-radius: 18px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 700;
      margin: 14px 0 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 住宿卡片 */
    .hotel-table {
      width: 100%;
      border-collapse: collapse;
      margin: 10px 0 12px;
      font-size: 14px;
    }
    .hotel-table td {
      padding: 3px 0;
      vertical-align: top;
    }
    .hotel-table td:first-child {
      width: 68px;
      opacity: 0.75;
    }

    .btn-coral {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--coral);
      color: var(--ink);
      text-decoration: none;
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: 7px 14px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 3px 0 var(--ink);
      cursor: pointer;
      font-family: inherit;
    }

    /* 可打勾清單 & 進度條 */
    .progress-text {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .progress-track {
      width: 100%;
      height: 14px;
      background: var(--bg-washi);
      border: 2.5px solid var(--ink);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .progress-fill {
      height: 100%;
      background: var(--wakatake);
      border-right: 2.5px solid var(--ink);
      width: 0%;
      transition: width 0.25s ease;
    }

    .check-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 4px;
      border-bottom: 1.5px solid #EAE3D5;
      gap: 10px;
    }
    .check-item:last-child { border-bottom: none; }

    .check-label {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      flex: 1;
      font-size: 15px;
    }

    .check-box {
      width: 24px;
      height: 24px;
      border: 2.5px solid var(--ink);
      border-radius: 8px;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .check-item.done .check-box { background: var(--wakatake); }
    .check-item.done .check-text { text-decoration: line-through; opacity: 0.55; }

    .del-btn {
      background: none;
      border: none;
      color: var(--ink);
      opacity: 0.45;
      font-size: 16px;
      cursor: pointer;
      padding: 2px 6px;
    }

    .add-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .add-input {
      flex: 1;
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 14px;
      background: var(--bg-washi);
      color: var(--ink);
    }

    .add-btn {
      background: var(--yamabuki);
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--ink);
    }

    /* 行李分類頁籤 */
    .luggage-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .lug-tab {
      border: 2px solid var(--ink);
      background: var(--bg-washi);
      border-radius: 999px;
      padding: 4px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .lug-tab.active { background: var(--mizu); }

    /* 小幫手 SOS */
    .sos-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .sos-card {
      background: var(--coral);
      border: var(--border-w) solid var(--ink);
      border-radius: 22px;
      padding: 14px 10px;
      text-align: center;
      box-shadow: 0 4px 0 var(--ink);
    }

    .sos-num { font-size: 32px; font-weight: 700; line-height: 1.1; }
    .sos-desc { font-size: 14px; margin: 4px 0 10px; }

    .call-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: var(--white);
      color: var(--ink);
      text-decoration: none;
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 5px 14px;
      font-size: 13.5px;
      font-weight: 700;
    }

    .phrase-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .phrase-jp { font-size: 19px; font-weight: 700; margin: 0 0 2px; }
    .phrase-furi { font-size: 12.5px; opacity: 0.75; margin: 0 0 4px; }
    .phrase-zh { font-size: 14.5px; font-weight: 700; margin: 0; }

    .zoom-btn {
      flex-shrink: 0;
      background: var(--mizu);
      border: 2.5px solid var(--ink);
      border-radius: 14px;
      padding: 7px 12px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 0 var(--ink);
    }

    /* 彈窗 */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(62, 58, 57, 0.72);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--bg-washi);
      border: 4px solid var(--ink);
      border-radius: 28px;
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 6px 0 var(--ink);
    }

    .modal-input {
      width: 100%;
      border: 2.5px solid var(--ink);
      border-radius: 12px;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 14px;
      margin-bottom: 10px;
      background: var(--white);
    }

    .motion-toggle {
      background: var(--white);
      border: 2px solid var(--ink);
      border-radius: 999px;
      padding: 4px 10px;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
  </style>
</head>
<body>

  <!-- 頂端固定選單 -->
  <nav class="top-nav" aria-label="主導覽列">
    <div class="top-nav-inner">
      <a href="#sec-flight" class="nav-pill c-mizu">✈️ 航班</a>
      <a href="#sec-schedule" class="nav-pill c-yama">📅 行程</a>
      <a href="#sec-hotel" class="nav-pill c-coral">🏠 住宿</a>
      <a href="#sec-pre" class="nav-pill c-waka">✅ 出發前</a>
      <a href="#sec-luggage" class="nav-pill c-mizu">🧳 行李</a>
      <a href="#sec-helper" class="nav-pill c-coral">🆘 小幫手</a>
    </div>
  </nav>

  <main class="app-container">

    <!-- 首頁繪本插圖 + 標題 -->
    <section class="ehon-card hero-card" aria-label="旅程封面">
      <div class="hero-svg-wrap">
        <svg viewBox="0 0 440 220" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="宮島大鳥居與小兔旅人繪本插畫">
          <g class="anim-float">
            <path d="M45 48 C45 38, 60 35, 66 42 C72 34, 88 37, 88 48 Z" fill="#FFFFFF" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/>
            <path d="M335 42 C335 33, 348 31, 353 37 C359 30, 374 33, 374 42 Z" fill="#FFFFFF" stroke="#3E3A39" stroke-width="2.5" stroke-linejoin="round"/>
          </g>
          <path d="M0 145 Q75 88 155 13
